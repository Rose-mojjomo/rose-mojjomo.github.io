<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rose 的常用网站</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 48px 20px;
      color: #1f2937;
      background: linear-gradient(135deg, #f5f7ff, #eefaf5);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    main {
      width: min(900px, 100%);
      margin: 0 auto;
    }

    h1 {
      margin-bottom: 8px;
      font-size: 34px;
    }

    .subtitle {
      margin-top: 0;
      color: #6b7280;
    }

    .links {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 18px;
      margin-top: 32px;
    }

    .card {
      display: block;
      padding: 24px;
      color: inherit;
      text-decoration: none;
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(31, 41, 55, 0.08);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 36px rgba(31, 41, 55, 0.14);
    }

    .icon {
      display: block;
      margin-bottom: 14px;
      font-size: 32px;
    }

    .name {
      display: block;
      margin-bottom: 6px;
      font-size: 20px;
      font-weight: 700;
    }

    .description {
      color: #6b7280;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <main>
    <h1>Rose 的常用网站</h1>
    <p class="subtitle">收藏一些经常使用的网站。</p>

    <section class="links">
  <a
    class="card"
    href="http://ipgw.neu.edu.cn/"
    target="_blank"
    rel="noopener noreferrer"
  >
    <span class="icon">🏫</span>
    <span class="name">东北大学校园网</span>
    <span class="description">校园网登录与网络服务</span>
  </a>

  <a
    class="card"
    href="https://tools.pdf24.org/zh/all-tools"
    target="_blank"
    rel="noopener noreferrer"
  >
    <span class="icon">📄</span>
    <span class="name">PDF24 工具</span>
    <span class="description">转换、合并、压缩和编辑 PDF</span>
  </a>

  <a
    class="card"
    href="https://pqjc.site/login"
    target="_blank"
    rel="noopener noreferrer"
  >
    <span class="icon">🌐</span>
    <span class="name">代理服务</span>
    <span class="description">代理服务登录与管理</span>
  </a>
  <a
  class="card"
  href="https://github.com/Rose-mojjomo"
  target="_blank"
  rel="noopener noreferrer"
>
  <span class="icon">🐙</span>
  <span class="name">我的 GitHub</span>
  <span class="description">查看我的主页和项目</span>
</a>
</section>
  </main>
</body>
</html>
